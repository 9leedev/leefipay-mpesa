name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Composer validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

  tests:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '9'
            php: '8.1'
            testbench: '7.*'
            laravel_app: '9.*'
          - laravel: '10'
            php: '8.1'
            testbench: '8.*'
            laravel_app: '10.*'
          - laravel: '11'
            php: '8.2'
            testbench: '9.*'
            laravel_app: '11.*'
          - laravel: '12'
            php: '8.2'
            testbench: '10.*'
            laravel_app: '12.*'
          - laravel: '13'
            php: '8.3'
            testbench: '11.*'
            laravel_app: '13.*'
          - laravel: '13'
            php: '8.4'
            testbench: '11.*'
            laravel_app: '13.*'

    env:
      COMPOSER_HOME: ${{ runner.temp }}/composer-home
      LEEFIPAY_BASE_URL: http://localhost
      LEEFIPAY_API_KEY: test-key
      LEEFIPAY_API_SECRET: test-secret
      LEEFIPAY_ENVIRONMENT: sandbox
      LEEFIPAY_WEBHOOKS_ENABLED: 'true'
      LEEFIPAY_WEBHOOK_SECRET: whsec_test_secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, bcmath, intl, fileinfo

      - name: Configure Composer for compatibility installs
        run: |
          mkdir -p "$COMPOSER_HOME"
          # Older Laravel majors may carry Packagist security advisories; CI still
          # needs them as disposable compatibility targets. Never use
          # --ignore-platform-reqs.
          composer config -g audit.block-insecure false

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install package test dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress \
            --with="orchestra/testbench:${{ matrix.testbench }}"

      - name: Run package test suite
        run: composer test

      - name: Laravel application integration
        env:
          PACKAGE_DIR: ${{ github.workspace }}
          LARAVEL_CONSTRAINT: ${{ matrix.laravel_app }}
          APP_DIR: ${{ runner.temp }}/leefipay-laravel-${{ matrix.laravel }}-php${{ matrix.php }}
        run: bash .github/scripts/laravel-integration.sh
